    "src/synthetic_counting_v48",
    "src/synthetic_counting_v49",
    "src/synthetic_counting_v50",
    "src/synthetic_counting_v51",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "artifacts",
    "colab_results",
    "data",
    "runs",
]
