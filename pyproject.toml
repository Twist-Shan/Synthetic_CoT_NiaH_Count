[project]
name = "trace-counting"
version = "0.1.0"
description = "Synthetic trace-enumeration counting experiments with probes, attention analysis, and Colab notebooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30",
    "matplotlib>=3.8",
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.41",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/trace_counting",
    "src/synthetic_niah_v3",
    "src/synthetic_niah_v4",
    "src/synthetic_niah_v5",
    "src/synthetic_counting_v6",
    "src/synthetic_counting_extensions",
    "src/synthetic_counting_v10",
    "src/synthetic_counting_v11",
    "src/synthetic_counting_v12",
    "src/synthetic_counting_v13",
    "src/synthetic_counting_v14",
    "src/synthetic_counting_v15",
    "src/synthetic_counting_v16",
    "src/synthetic_counting_v16_1",
    "src/synthetic_counting_v16_2",
    "src/synthetic_counting_v16_3",
    "src/synthetic_counting_v17",
    "src/synthetic_counting_v18",
    "src/synthetic_counting_v19",
    "src/synthetic_counting_v20",
    "src/synthetic_counting_v21",
    "src/synthetic_counting_v22",
    "src/synthetic_counting_v23",
    "src/synthetic_counting_v24",
    "src/synthetic_counting_v24_2",
    "src/synthetic_counting_v24_3",
    "src/synthetic_counting_v24_4",
    "src/synthetic_counting_v24_5",
    "src/synthetic_counting_v24_6",
    "src/synthetic_counting_v24_7",
    "src/synthetic_counting_v24_8",
    "src/synthetic_counting_v25",
    "src/synthetic_counting_v25_1",
